services:
  - type: web
    name: lifepattern-backend
    env: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      - key: DATABASE_URL
        value: postgresql://postgres:postgres@localhost:5432/lifepattern
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: PORT
        value: 8080
      - key: ENVIRONMENT
        value: production
      - key: CORS_ORIGIN
        value: https://lifepattern-ai-dc5fe.web.app
    healthCheckPath: /health
    autoDeploy: true 