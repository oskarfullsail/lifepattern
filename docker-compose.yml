services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: lifepattern-postgres
    environment:
      POSTGRES_DB: lifepattern
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/migrations:/docker-entrypoint-initdb.d
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d lifepattern"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # AI Service
  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: lifepattern-ai-service
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - PYTHONPATH=/app
    volumes:
      - ./ai-service/models:/app/models
      - ./ai-service/logs:/app/logs
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Backend Service
  backend:
    build: ./backend
    container_name: lifepattern-backend
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - HOST=0.0.0.0
      - DATABASE_URL=postgres://postgres:password@postgres:5432/lifepattern?sslmode=disable
      - AI_SERVICE_URL=http://ai-service:8000
      - JWT_SECRET_KEY=your-super-secret-jwt-key-change-in-production
      - JWT_ISSUER=lifepattern
      - JWT_AUDIENCE=lifepattern-users
      - JWT_ACCESS_TOKEN_EXPIRY=15m
      - JWT_REFRESH_TOKEN_EXPIRY=720h
      - WEBAUTHN_RP_ID=localhost
      - WEBAUTHN_RP_NAME=LifePattern
      - WEBAUTHN_RP_ORIGIN=http://localhost:8080
      - CHALLENGE_EXPIRY=5m
      - LINK_TOKEN_EXPIRY=10m
      - DEBUG=true
      - LOG_LEVEL=info
    volumes:
      - backend_logs:/app/logs
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      ai-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  postgres_data:
    driver: local
  backend_logs:
    driver: local

networks:
  default:
    name: lifepattern-network 