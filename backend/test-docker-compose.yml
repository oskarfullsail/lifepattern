# Docker Compose for Testing Backend Locally
version: '3.8'

services:
  # Test PostgreSQL Database
  test-postgres:
    image: postgres:15-alpine
    container_name: lifepattern-test-postgres
    environment:
      POSTGRES_DB: lifepattern_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: testpassword
    ports:
      - "5435:5432"  # Different port to avoid conflicts
    volumes:
      - ./migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d lifepattern_test"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - test-network

  # Test Backend Service
  test-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lifepattern-test-backend
    ports:
      - "8082:8080"
    environment:
      - PORT=8080
      - HOST=0.0.0.0
      - DATABASE_URL=postgres://postgres:testpassword@test-postgres:5432/lifepattern_test?sslmode=disable
      - AI_SERVICE_URL=http://localhost:8000
      - JWT_SECRET_KEY=test-secret-key-for-testing-only
      - JWT_ISSUER=lifepattern-test
      - JWT_AUDIENCE=lifepattern-test-users
      - JWT_ACCESS_TOKEN_EXPIRY=15m
      - JWT_REFRESH_TOKEN_EXPIRY=24h
      - WEBAUTHN_RP_ID=localhost
      - WEBAUTHN_RP_NAME=LifePattern Test
      - WEBAUTHN_RP_ORIGIN=http://localhost:8081
      - CHALLENGE_EXPIRY=5m
      - LINK_TOKEN_EXPIRY=10m
      - DEBUG=true
      - LOG_LEVEL=debug
    depends_on:
      test-postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - test-network
    command: ["./main"]

networks:
  test-network:
    name: lifepattern-test-network
    driver: bridge

